name: FoodAndFriends
options:
  bundleIdPrefix: com.foodandfriends
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "8.0.0"

targets:
  FoodAndFriends:
    scheme:
      testTargets:
        - FoodAndFriendsTests
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FoodAndFriends
        excludes:
          - "**/.DS_Store"
          - "**/Info.plist"
    entitlements:
      path: FoodAndFriends/FoodAndFriends.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    info:
      path: FoodAndFriends/Info.plist
      properties:
        CFBundleName: "Food & Friends"
        CFBundleDisplayName: "Food & Friends"
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "Food & Friends uses the camera when you tap Photo on a recipe step — for example, to keep a picture of the onions at the right brown. Photos are saved to that recipe."
        NSLocationWhenInUseUsageDescription: "Food & Friends uses your location once, when you tap Find me, to fill in your city — for example \"Cincinnati, OH\" on your profile so friends know where you cook. Your exact location is never stored or shared."
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - com.googleusercontent.apps.466358991702-iamnbk9rg0l1ss68enmhjudrg8d75c1j
        GIDClientID: 466358991702-iamnbk9rg0l1ss68enmhjudrg8d75c1j.apps.googleusercontent.com
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.foodandfriends.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: 47M8L4G38J
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseStorage
      - package: Firebase
        product: FirebaseFunctions
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift

  FoodAndFriendsTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FoodAndFriendsTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.foodandfriends.app.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: FoodAndFriends
