name: FoodAndFriends
options:
  bundleIdPrefix: com.foodandfriends
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "8.0.0"
  SwiftLintPlugins:
    url: https://github.com/SimplyDanny/SwiftLintPlugins
    from: "0.57.0"

targets:
  FoodAndFriends:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FoodAndFriends
        excludes:
          - "**/.DS_Store"
          - "**/Info.plist"
    info:
      path: FoodAndFriends/Info.plist
      properties:
        CFBundleName: "Food & Friends"
        CFBundleDisplayName: "Food & Friends"
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        UILaunchScreen:
          UIColorName: AccentColor
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocationWhenInUseUsageDescription: "Food and Friends uses your location to help you find nearby dining spots and connect with friends in your area."
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - com.googleusercontent.apps.466358991702-iamnbk9rg0l1ss68enmhjudrg8d75c1j
        GIDClientID: 466358991702-iamnbk9rg0l1ss68enmhjudrg8d75c1j.apps.googleusercontent.com
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.foodandfriends.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: 47M8L4G38J
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseStorage
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
      - package: SwiftLintPlugins
        product: SwiftLintBuildToolPlugin

  FoodAndFriendsTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FoodAndFriendsTests
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.foodandfriends.app.tests
        DEVELOPMENT_TEAM: 47M8L4G38J
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: FoodAndFriends
